<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">
    <ui:define name="title">Alta de Ingresos</ui:define>
    <ui:define name="content">
        <h:form id="form">
            <!-- Controles comunes: Notificaciones, Dialogo "STATUS" y Dialogo Confirmar (Global) -->
            <ui:include src="/protected/common/status-info.xhtml" />
            <p:panel id="pnl-datos-generales" header="DATOS GENERALES" >
                <div class="p-grid ui-fluid">
                    <div class="p-col-12 p-md-6">
                        <p:outputLabel for="soClientes" value="Receptor" />
                        <p:selectOneMenu id="soClientes" autoWidth="false" value="#{ingresosCrudBean.idCte}" filter="true" filterMatchMode="contains">
                            <f:selectItem itemLabel="SELECCIONE UN CLIENTE" itemValue="" noSelectionOption="true" />
                            <f:selectItems var="cliente" value="#{ingresosCrudBean.listaCtes}" itemLabel="#{cliente.nombre}#{cliente.alias == null ? '' : ' ('.concat(cliente.alias).concat(')')}" itemValue="#{cliente.cteCve}" />
                            <p:ajax listener="#{ingresosCrudBean.filtroCte}" process="@this" update="dt-Factura"/>
                        </p:selectOneMenu>
                    </div>
                    <p:divider></p:divider>
                    <div class="p-col-12 p-md-5">
                        <p:selectBooleanCheckbox id="statusPagoParcial" value="#{ingresosCrudBean.pagoParcial}" itemLabel="Pago Parcial"  >
                            <p:ajax update="messages :form:dt-Factura" listener="#{ingresosCrudBean.filtroCte}" />
                        </p:selectBooleanCheckbox>
                        <p:selectBooleanCheckbox id="statusPorCobrar" value="#{ingresosCrudBean.porCobrar}" itemLabel="Por Cobrar">
                            <p:ajax update="messages :form:dt-Factura" listener="#{ingresosCrudBean.filtroCte}"/>
                        </p:selectBooleanCheckbox>
                    </div>
                </div>
            </p:panel>
            <div style="padding-top: 2rem;">
                <p:dataTable id="dt-Factura" var="fact" value="#{ingresosCrudBean.listaFactura}" reflow="true" rowKey="#{fact.id}" size="small"
                             paginator="true" rows="10" rowSelectMode="add" paginatorPosition="bottom" selectionMode="single" filterBy="#{fact.status.nombre}">     
                    <p:column headerText="Factura" width="6rem" style="text-align: center;">
                        <h:outputText value="#{fact.nomSerie}-#{fact.numero}" />
                    </p:column>
                    <ui:remove>
	                    <p:column headerText="Moneda" width="5rem" style="text-align: center;">
	                        <h:outputText value="#{fact.moneda}" />
	                    </p:column>
                    </ui:remove>
                    <p:column headerText="Fecha" width="6rem" style="text-align: center;">
                        <h:outputText value="#{fact.fecha}">
                            <f:convertDateTime pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Emisor" style="text-align: center;">
                    	<h:outputText value="#{fact.emisorNombre}"/>
                    </p:column>
                    <p:column headerText="Status" width="10rem" style="text-align: center;">
                        <h:outputText value="#{fact.status.nombre}"/>
                    </p:column>
                    <p:column headerText="Total" width="8rem" style="text-align: right;">
                        <h:outputText value="#{fact.total}">
                            <f:convertNumber pattern="¤ #,##0.00" currencySymbol="$" />
                        </h:outputText>
                    </p:column>
                    <p:column style="text-align: center;" width="10rem">
                        <p:commandButton icon="pi pi-plus" value="Agregar Pago" align="left" action="#{ingresosCrudBean.calculoFactura}" 
                                         update="form:pnlCliente :form:factura-new :form:monto-new :form:saldo-new :form:fecha :form:Bco :form:tipoPago :form:referencia-new :form:cantidad-new" 
                                         resetValues="true" styleClass="ui-button-raised" process="@this"
                                         onstart="PF('statusInfoDialog').show();" oncomplete="PF('dialogFacturaConfirmacion').show(); PF('statusInfoDialog').hide();" >
                            <f:setPropertyActionListener value="#{fact}" target="#{ingresosCrudBean.facturaSelect}" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
            </div>
            <p:dialog id="dlgConfirmacion" header="Pagar" showEffect="fade" modal="true" widgetVar="dialogFacturaConfirmacion" responsive="true" fitViewport="true" style="width: 90vw; max-width: 45rem;">
                <p:outputPanel id="pnlCliente" class="p-grid ui-fluid p-col-12" rendered="#{ingresosCrudBean.facturaSelect != null}">
                    <div class="p-col-4 p-md-4">
                        <p:outputLabel for="@next" value="Factura" />
                        <p:inputText widgetVar="factura-new" id="factura-new" value="#{ingresosCrudBean.facturaSelect.nomSerie}-#{ingresosCrudBean.facturaSelect.numero}" readonly="true" />
                    </div>
                    <div class="p-col-4 p-md-4">
                        <p:outputLabel for="@next" value="Total factura" />
                        <p:inputNumber widgetVar="monto-new" id="monto-new" value="#{ingresosCrudBean.facturaSelect.total}" readonly="true" decimalPlaces="2" symbol="$ " symbolPosition="p" inputStyle="text-align: right;">
                        </p:inputNumber>
                        
                    </div>
                    <div class="p-col-4 p-md-4">
                        <p:outputLabel for="@next" value="Debe" />
                        <p:inputNumber widgetVar="saldo-new" id="saldo-new" value="#{ingresosCrudBean.saldoAnterior}" readonly="true" decimalPlaces="2" symbol="$ " symbolPosition="p" inputStyle="text-align: right;">
                        </p:inputNumber>
                    </div>
                    <div class="p-col-12 p-md-12">
                    	<p:separator />
                        <b>Datos adicionales</b>
                    </div>
                    <div class="p-col-4 p-md-4">
                        <p:outputLabel for="@next" value="Fecha de pago"/>
                        <p:datePicker id="fecha" showIcon="true" placeholder="Fecha" value="#{ingresosCrudBean.fecha}" pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6">
                            <p:ajax process="@this" />
                        </p:datePicker>
                    </div>
                    <div class="p-col-4 p-md-4">
                        <p:outputLabel for="@next" value="Hora de pago" />
                        <p:datePicker id="hora" value="#{ingresosCrudBean.hora}" timeOnly="true" pattern="HH:mm" hourFormat="24" readonlyInput="false" placeholder="hh:mm (p.e. 23:59)" >
                            <p:ajax process="@this" />
                        </p:datePicker>
                    </div>
                    <div class="p-col-4 p-md-4">
                        <p:outputLabel for="@next" value="Banco" />
                        <p:selectOneMenu id="Bco" autoWidth="true" value="#{ingresosCrudBean.bancoCve}">
                            <f:selectItem itemLabel="" itemValue="" />
                            <f:selectItems value="#{ingresosCrudBean.listaBancos}" var="banco" itemLabel="#{banco.nombre}" itemValue="#{banco.id}" />
                        </p:selectOneMenu>
                    </div>
                    <div class="p-col-4 p-md-4">
                        <p:outputLabel for="@next" value="Forma de pago" />
                        <p:selectOneMenu id="tipoPago" autoWidth="false" value="#{ingresosCrudBean.tipoP}">
                            <f:selectItem itemLabel="" itemValue="" />
                            <f:selectItems value="#{ingresosCrudBean.listatipoPago}" var="tipoP" itemLabel="#{tipoP.nombre}" itemValue="#{tipoP.id}" />
                        </p:selectOneMenu>
                    </div>
                    <div class="p-col-4 p-md-4">
                        <p:outputLabel for="@next" value="Referencia"/>
                        <p:inputText widgetVar="referencia-new" id="referencia-new" value="#{ingresosCrudBean.referencia}" />
                    </div>
                    <div class="p-col-4 p-md-4">
                        <p:outputLabel for="@next" value="A pagar" />
                        <p:inputNumber widgetVar="cantidad-new" id="cantidad-new" value="#{ingresosCrudBean.cantidadApagar}" symbol="$ " decimalPlaces="2" inputStyle="text-align: right;"/>
                    </div>
                    <ui:fragment rendered="#{not empty ingresosCrudBean.facturaSelect and ingresosCrudBean.facturaSelect.metodoPago eq ingresosCrudBean.PAGO_EN_PARCIALIDADES}">
                        <div class="p-col-4 p-md-4" >
                            <p:outputLabel for="@next" value="Parcialidad" />
                            <p:inputNumber widgetVar="parcialidad-new" id="parcialidad-new" value="#{ingresosCrudBean.parcialidad}" decimalPlaces="0" thousandSeparator="" />
                        </div>
                    </ui:fragment>
                </p:outputPanel>
                <f:facet name="footer">
                    <p:commandButton value="Añadir" icon="pi pi-check" actionListener="#{ingresosCrudBean.agregaPagoFactura()}" process="pnlCliente @this" update="pnlCliente detallesFacturacion" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide(); if(args.success) {PF('dialogFacturaConfirmacion').hide();}" />
                    <p:commandButton value="Cerrar" icon="pi pi-times" onclick="PF('dialogFacturaConfirmacion').hide();" class="ui-button-secondary" />
                </f:facet>
            </p:dialog>
            <div style="padding-top: 2rem;">
                <p:dataTable id="detallesFacturacion" var="detFactura" value ="#{ingresosCrudBean.listaPago}">
                    <p:column headerText="Factura" width="8em">
                        <h:outputText value="#{detFactura.pago.factura.nomSerie}-#{detFactura.pago.factura.numero}"/>
                    </p:column>
                    <p:column headerText="Fecha de Pago" style="text-align: center;">
                        <h:outputText value="#{detFactura.pago.fecha}" >
                            <f:convertDateTime pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Hora de Pago" style="text-align: center;">
                        <h:outputText value="#{not empty detFactura.pago.hora ? detFactura.pago.hora : '-'}" />
                    </p:column>
                    <p:column headerText="Total factura" style="text-align: right;">
                        <h:outputText value="#{detFactura.pago.factura.total}">
                            <f:convertNumber pattern="¤ #,##0.00" currencySymbol="$" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Saldo anterior" style="text-align: right;">
                        <h:outputText value="#{detFactura.saldoAnterior}">
                            <f:convertNumber pattern="¤ #,##0.00" currencySymbol="$" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="A pagar" style="text-align: right;">
                        <h:outputText value="#{detFactura.pago.monto}" style="font-weight: bold;">
                            <f:convertNumber pattern="¤ #,##0.00" currencySymbol="$" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Parcialidad" style="text-align: right;">
                        <h:outputText value="#{not empty detFactura.pago.parcialidad and detFactura.pago.parcialidad ne 0 ? detFactura.pago.parcialidad : '-'}" style="font-weight: bold;" />
                    </p:column>
                    <p:column headerText="Saldo pendiente" style="text-align: right;">
                        <h:outputText value="#{detFactura.saldo}">
                            <f:convertNumber pattern="¤ #,##0.00" currencySymbol="$" />
                        </h:outputText>
                    </p:column>
                    <p:column width="2rem">
                        <p:commandButton class="ui-button-danger" icon="pi pi-times" actionListener="#{ingresosCrudBean.eliminaPagoFactura(detFactura)}" update="detallesFacturacion" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();" />
                    </p:column>
                    <f:facet name="footer">
                        <div style="text-align: right;">
                            <p:outputLabel value="Bueno por "/>
                            <p:outputLabel value="#{ingresosCrudBean.subtotalGlobal}" style="width: 10rem;">
                                <f:convertNumber pattern="$ #,##0.00" />
                            </p:outputLabel>
                        </div>
                        <div style="text-align: right;">
                            <p:outputLabel value="I.V.A. "/>
                            <p:outputLabel value="#{ingresosCrudBean.ivaGlobal}">
                                <f:convertNumber pattern="$ #,##0.00" />
                            </p:outputLabel>
                        </div>			
                        <div style="text-align: right;">
                            <p:outputLabel value="A Pagar "/>
                            <p:outputLabel value="#{ingresosCrudBean.totalGlobal}">
                                <f:convertNumber pattern="$ #,##0.00" />
                            </p:outputLabel>
                        </div>
                        <div style="text-align: center;">
                            <p:outputLabel value="Importe con letra:" styleClass="p-ml-4 p-mr-2"/>
                            <p:outputLabel id="montoLetra" value="#{ingresosCrudBean.montoLetra}"/>
                        </div>
                    </f:facet>
                </p:dataTable>
            </div>
            <div align="center" style="padding-top: 2rem;">
                <p:commandButton value="Generar pago" styleClass="ui-button-raised ui-button-secondary" actionListener="#{ingresosCrudBean.savePago()}" 
                                 update="form:detallesFacturacion" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();" />
            </div>
        </h:form>
    </ui:define>
</ui:composition>

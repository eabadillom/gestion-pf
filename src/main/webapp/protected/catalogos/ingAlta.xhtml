<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:fmt="http://java.sun.com/jsp/jstl/fmt"
                xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">
    <ui:define name="title">Alta de Ingresos</ui:define>
    <ui:define name="content">
    	<ui:include src="/protected/common/custom-styles.xhtml" />
        <h:form id="form">
            <!-- Controles comunes: Notificaciones, Dialogo "STATUS" y Dialogo Confirmar (Global) -->
            <ui:include src="/protected/common/status-info.xhtml" />
            <p:panel id="pnl-datos-generales" header="DATOS GENERALES" >
                <div class="p-grid ui-fluid">
                    <div class="p-col-12 p-md-4">
                        <p:outputLabel for="soClientes" value="Receptor" styleClass="ui-custom-title-small"/>
                        <p:selectOneMenu id="soClientes" autoWidth="false" value="#{ingresosCrudBean.idCte}" filter="true" filterMatchMode="contains">
                            <f:selectItem itemLabel="--SELECCIONE UN CLIENTE--" noSelectionOption="true" />
                            <f:selectItems var="cliente" value="#{ingresosCrudBean.listaCtes}" itemLabel="#{cliente.nombre}#{cliente.alias == null ? '' : ' ('.concat(cliente.alias).concat(')')}" itemValue="#{cliente.cteCve}" />
                            <p:ajax listener="#{ingresosCrudBean.filtroCte}" process="@this" update="dt-Factura" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="p-col-6 p-md-3">
                    	<p:outputLabel value="Estado de las facturas" styleClass="ui-custom-title-small" />
                    	<p:selectBooleanButton id="statusPagoParcial" value="#{ingresosCrudBean.pagoParcial}" onLabel="Pago parcial" onIcon="pi pi-check" offLabel="Pago parcial" offIcon="pi pi-times">
                            <p:ajax update="messages form:dt-Factura" listener="#{ingresosCrudBean.filtroCte}" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
                        </p:selectBooleanButton>
                    </div>
                    <div class="p-col-6 p-md-3">
                    	<p:outputLabel value="." style="color: rgba(255, 255, 255, 0)!important;" styleClass="ui-custom-title-small" />
                    	<p:selectBooleanButton id="statusPorCobrar" value="#{ingresosCrudBean.porCobrar}" onLabel="Por cobrar" onIcon="pi pi-check" offLabel="Por cobrar" offIcon="pi pi-times">
                            <p:ajax update="messages form:dt-Factura" listener="#{ingresosCrudBean.filtroCte}" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
                        </p:selectBooleanButton>
                    </div>
                </div>
            </p:panel>
            <div style="padding-top: 2rem;">
                <p:dataTable id="dt-Factura" var="fact" value="#{ingresosCrudBean.facturacionPendiente()}" reflow="true" rowKey="#{fact.id}" size="small"
                             paginator="true" rows="10" rowSelectMode="add" paginatorPosition="bottom" selectionMode="single" filterBy="#{fact.status.nombre}">     
                    <p:column headerText="Factura" width="6rem" style="text-align: center;">
                        <h:outputText value="#{fact.nomSerie}-#{fact.numero}" />
                    </p:column>
                    <ui:remove>
	                    <p:column headerText="Moneda" width="5rem" style="text-align: center;">
	                        <h:outputText value="#{fact.moneda}" />
	                    </p:column>
                    </ui:remove>
                    <p:column headerText="Fecha" width="6rem" style="text-align: center;">
                        <h:outputText value="#{fact.fecha}">
                            <f:convertDateTime pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Emisor" style="text-align: center;">
                    	<h:outputText value="#{fact.emisorNombre}"/>
                    </p:column>
                    <p:column headerText="Status" width="10rem" style="text-align: center;">
                        <h:outputText value="#{fact.status.nombre}"/>
                    </p:column>
                    <p:column headerText="Total" width="8rem" style="text-align: right;">
                        <h:outputText value="#{fact.total}">
                            <f:convertNumber pattern="¤ #,##0.00" currencySymbol="$" />
                        </h:outputText>
                    </p:column>
                    <p:column style="text-align: center;" width="6rem">
                        <p:commandButton icon="fa fas fa-money-bill" value="Pagar" action="#{ingresosCrudBean.calculoFactura}" 
                                         update="form:pnlCliente"
                                         resetValues="true" process="@this"
                                         onstart="PF('statusInfoDialog').show();" oncomplete="PF('dialogFacturaConfirmacion').show(); PF('statusInfoDialog').hide();" >
                            <f:setPropertyActionListener value="#{fact}" target="#{ingresosCrudBean.facturaSelect}" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
            </div>
            <p:dialog id="dlgConfirmacion" header="Información del pago" showEffect="fade" modal="true" widgetVar="dialogFacturaConfirmacion" responsive="true" fitViewport="true" style="width: 90vw; max-width: 45rem;">
                <p:outputPanel id="pnlCliente" class="p-grid ui-fluid p-col-12" rendered="#{ingresosCrudBean.facturaSelect != null}">
                    <div class="p-col-4 p-md-4">
                    	<div>
	                        <p:outputLabel for="@next" value="Factura" styleClass="ui-custom-title-small"/>
                    	</div>
                        <div class="ui-custom-data">
	                        <p:outputLabel value="#{ingresosCrudBean.facturaSelect.nomSerie}-#{ingresosCrudBean.facturaSelect.numero}">
	                        </p:outputLabel>
                        </div>
                    </div>
                    <div class="p-col-4 p-md-4">
                    	<div>
	                        <p:outputLabel for="@next" value="Total  de la factura" styleClass="ui-custom-title-small"/>
                    	</div>
                        <div class="ui-custom-data">
                        	<p:outputLabel value="#{ingresosCrudBean.facturaSelect.total}">
                        		<f:convertNumber type="currency" locale="es_MX" currencySymbol="$" />
                        	</p:outputLabel>
                        </div>
                    </div>
                    <div class="p-col-4 p-md-4">
                    	<div>
	                        <p:outputLabel for="@next" value="Debe" styleClass="ui-custom-title-small"/>
                    	</div>
                        <div class="ui-custom-data">
                        	<p:outputLabel value="#{ingresosCrudBean.saldoAnterior}">
                        		<f:convertNumber type="currency" locale="es_MX" currencySymbol="$" />
                        	</p:outputLabel>
                        </div>
                    </div>
                    <div class="p-col-12 p-md-12">
                    	<p:separator />
                        <b>Datos adicionales</b>
                    </div>
                    <div class="p-col-4 p-md-4">
                        <p:outputLabel for="@next" value="Fecha de pago" styleClass="ui-custom-title-small"/>
                        <p:datePicker id="fecha" showIcon="true" placeholder="Fecha" value="#{ingresosCrudBean.fecha}" pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6">
                            <p:ajax process="@this" />
                        </p:datePicker>
                    </div>
                    <div class="p-col-4 p-md-4">
                        <p:outputLabel for="@next" value="Hora de pago" styleClass="ui-custom-title-small"/>
                        <p:datePicker id="hora" value="#{ingresosCrudBean.hora}" timeOnly="true" pattern="HH:mm" hourFormat="24" readonlyInput="false" placeholder="hh:mm (p.e. 23:59)" >
                            <p:ajax process="@this" />
                        </p:datePicker>
                    </div>
                    <div class="p-col-4 p-md-4">
                        <p:outputLabel for="@next" value="Banco" styleClass="ui-custom-title-small"/>
                        <p:selectOneMenu id="Bco" autoWidth="true" value="#{ingresosCrudBean.bancoCve}">
                            <f:selectItem itemLabel="" itemValue="" />
                            <f:selectItems value="#{ingresosCrudBean.listaBancos}" var="banco" itemLabel="#{banco.nombre}" itemValue="#{banco.id}" />
                        </p:selectOneMenu>
                    </div>
                    <div class="p-col-4 p-md-4">
                        <p:outputLabel for="@next" value="Forma de pago" styleClass="ui-custom-title-small"/>
                        <p:selectOneMenu id="tipoPago" autoWidth="false" value="#{ingresosCrudBean.tipoP}">
                            <f:selectItem itemLabel="" itemValue="" />
                            <f:selectItems value="#{ingresosCrudBean.tiposDePago()}" var="tipoP" itemLabel="#{tipoP.nombre}" itemValue="#{tipoP.id}" />
                        </p:selectOneMenu>
                    </div>
                    <div class="p-col-4 p-md-4">
                        <p:outputLabel for="@next" value="Referencia" styleClass="ui-custom-title-small"/>
                        <p:inputText widgetVar="referencia-new" id="referencia-new" value="#{ingresosCrudBean.referencia}" />
                    </div>
                    <div class="p-col-4 p-md-4">
                        <p:outputLabel for="@next" value="A pagar" styleClass="ui-custom-title-small"/>
                        <p:inputNumber widgetVar="cantidad-new" id="cantidad-new" value="#{ingresosCrudBean.cantidadApagar}" symbol="$ " decimalPlaces="2" inputStyle="text-align: right;"/>
                    </div>
                    <ui:fragment rendered="#{not empty ingresosCrudBean.facturaSelect and ingresosCrudBean.facturaSelect.metodoPago eq ingresosCrudBean.PAGO_EN_PARCIALIDADES}">
                        <div class="p-col-4 p-md-4" >
                            <p:outputLabel for="@next" value="Parcialidad" styleClass="ui-custom-title-small"/>
                            <p:inputNumber widgetVar="parcialidad-new" id="parcialidad-new" value="#{ingresosCrudBean.parcialidad}" decimalPlaces="0" thousandSeparator="" />
                        </div>
                    </ui:fragment>
                </p:outputPanel>
                <f:facet name="footer">
                    <p:commandButton value="Agregar" icon="pi pi-check" actionListener="#{ingresosCrudBean.agregaPagoFactura()}" process="pnlCliente @this" update="form:dt-Factura form:pnlCliente form:detallesFacturacion" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide(); if(args.success) {PF('dialogFacturaConfirmacion').hide();}" />
                    <p:commandButton value="Cerrar" icon="pi pi-times" onclick="PF('dialogFacturaConfirmacion').hide();" class="ui-button-secondary" />
                </f:facet>
            </p:dialog>
            <div style="padding-top: 2rem;">
                <p:dataTable id="detallesFacturacion" var="detFactura" value ="#{ingresosCrudBean.listaPago}" size="small">
                    <p:column headerText="Factura" width="8em">
                        <h:outputText value="#{detFactura.pago.factura.nomSerie}-#{detFactura.pago.factura.numero}"/>
                    </p:column>
                    <p:column headerText="Fecha-hora de pago" style="text-align: center;">
                        <h:outputText value="#{detFactura.pago.fecha}" >
                            <f:convertDateTime pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6"/>
                            <h:outputText value="#{not empty detFactura.pago.hora ? detFactura.pago.hora : '-'}" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Total factura" style="text-align: right;">
                        <h:outputText value="#{detFactura.pago.factura.total}">
                            <f:convertNumber pattern="¤ #,##0.00" currencySymbol="$" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Saldo anterior" style="text-align: right;">
                        <h:outputText value="#{detFactura.saldoAnterior}">
                            <f:convertNumber pattern="¤ #,##0.00" currencySymbol="$" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="A pagar" style="text-align: right;">
                        <h:outputText value="#{detFactura.pago.monto}" style="font-weight: bold;">
                            <f:convertNumber pattern="¤ #,##0.00" currencySymbol="$" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Parcialidad" style="text-align: right;">
                        <h:outputText value="#{not empty detFactura.pago.parcialidad and detFactura.pago.parcialidad ne 0 ? detFactura.pago.parcialidad : '-'}" style="font-weight: bold;" />
                    </p:column>
                    <p:column headerText="Saldo pendiente" style="text-align: right;">
                        <h:outputText value="#{detFactura.saldo}">
                            <f:convertNumber pattern="¤ #,##0.00" currencySymbol="$" />
                        </h:outputText>
                    </p:column>
                    <p:column width="2rem">
                        <p:commandButton class="ui-button-danger" icon="pi pi-times" actionListener="#{ingresosCrudBean.eliminaPagoFactura(detFactura)}" update="detallesFacturacion" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();" />
                    </p:column>
                    <p:columnGroup type="footer">
                    	<p:row>
                    		<p:column colspan="8">
                    		</p:column>
                    	</p:row>
                    	<p:row>
                    		<p:column rowspan="2" colspan="2">
                    		</p:column>
                    		<p:column footerText="Subtotal" style="text-align: right;"/>
                    		<p:column footerText="IVA" style="text-align: right;"/>
                    		<p:column footerText="Total" style="text-align: right;"/>
                    		<p:column rowspan="2" colspan="3">
                    		</p:column>
                    	</p:row>
                    	<p:row>
                    		<p:column footerText="#{ingresosCrudBean.format(ingresosCrudBean.subtotalGlobal)}" style="text-align: right;"/>
                    		<p:column footerText="#{ingresosCrudBean.format(ingresosCrudBean.ivaGlobal)}" style="text-align: right;" />
                    		<p:column footerText="#{ingresosCrudBean.format(ingresosCrudBean.totalGlobal)}" style="text-align: right;"/>
                    	</p:row>
                    	<p:row>
                    		<p:column colspan="8" footerText="Importe con letra: #{ingresosCrudBean.montoLetra}" style="text-align: center;"></p:column>
                    	</p:row>
                    </p:columnGroup>
                    <f:facet name="footer">
                        <div style="text-align: center;">
                            
                        </div>
                    </f:facet>
                </p:dataTable>
            </div>
            <div align="center" style="padding-top: 2rem;">
                <p:commandButton icon="fa fas fa-save" value="Guardar pagos" styleClass="ui-button-raised ui-button-secondary" actionListener="#{ingresosCrudBean.savePago()}" 
                                 update="form:detallesFacturacion" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();" />
            </div>
        </h:form>
    </ui:define>
</ui:composition>

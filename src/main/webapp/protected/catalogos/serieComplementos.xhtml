<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui" 
    template="/WEB-INF/template.xhtml">
    <ui:define name="title">Serie Complementos de Pagos</ui:define>
    <ui:define name="content">
        <h:form id="form" enctype="multipart/form-data">
            <!-- Controles comunes: Notificaciones, Dialogo "STATUS" y Dialogo Confirmar (Global) -->
            <ui:include src="/protected/common/status-info.xhtml" />
            <p:panel id="pnlDatosGenerales" header="DATOS GENERALES" >
                <div class="p-grid ui-fluid">
                    <div class="p-col-12 p-md-3">
                        <p:commandButton value="Agregar" icon="pi pi-plus" styleClass="ui-button-info p-mr-2 p-mb-2" 
                            actionListener="#{serieComplementoBean.openNew()}" onstart="PF('statusInfoDialog').show();" 
                            oncomplete="PF('statusInfoDialog').hide(); PF('dlgGuardarComplemento').show();" resetValues="true" />
                    </div>
                </div>
                <div class="p-grid ui-fluid">
                    <div class="p-col-12 p-md-3">
                        <p:outputLabel for="soEmisores" value="Emisor" />
                        <p:selectOneMenu id="soEmisores" converter="entityConverter" value="#{serieComplementoBean.emisorSelected}" filter="true" 
                            filterMatchMode="contains" onchange="PF('statusInfoDialog').show();" >
                            <f:selectItem itemLabel="--SELECCIONE UN EMISOR--" />
                            <f:selectItems value="#{serieComplementoBean.listEmisores}" var="emisor" itemLabel="#{emisor.nb_emisor}" itemValue="#{emisor}" />
                            <p:ajax listener="#{serieComplementoBean.filtrarSeriesComplementos()}" oncomplete="PF('statusInfoDialog').hide();" 
                                process="@this" update="form:dtSerieComplementos" />
                        </p:selectOneMenu>
                    </div>
                </div>
            </p:panel>

            <p:spacer style="height: 2rem;"/>

            <p:dataTable id="dtSerieComplementos" widgetVar="dtSerieComplementos" var="serieCompPago" value="#{serieComplementoBean.listSerieComplemento}" 
                rowKey="#{serieCompPago.id}" reflow="true" selection="#{serieComplementoBean.serieComplementoSelected}" rowSelectMode="single" 
                paginator="true" rows="10" paginatorPosition="bottom" >
                <p:column headerText="Serie" width="5rem" style="text-align:center">
                    <h:outputText value="#{serieCompPago.serie}" />
                </p:column>
                <p:column headerText="No. Inicial" width="5rem" style="text-align:center">
                    <h:outputText value="#{serieCompPago.numero}" />
                </p:column>
                <p:column headerText="Emisor">
                    <h:outputText value="#{serieCompPago.emisor.nb_emisor}" />
                </p:column>
                <p:column headerText="Status">
                    <h:outputText value="#{serieCompPago.statusSerie.nombre}" />
                </p:column>
                <p:column width="2rem" style="text-align: center;">
                    <p:commandButton icon="pi pi-bars" styleClass="ui-button-info" process="@this" resetValues="true"
                        onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide(); PF('dlgActualizarComplemento').show();" 
                        actionListener="#{serieComplementoBean.actualizarComplemento(serieCompPago)}" disabled="#{serieCompPago.statusSerie.id == 2}" />
                </p:column>
            </p:dataTable>

            <p:dialog id="dlgGuardarComplemento" header="Serie Complemento de Pago" widgetVar="dlgGuardarComplemento"
                modal="true" showEffect="fade" responsive="true" closable="true" >
                <p:outputPanel id="panelGuardarComplemento" class="ui-fluid">
                    <div class="p-field">
                        <p:outputLabel for="@next" value="EMISOR:" />
                        <p:selectOneMenu value="#{serieComplementoBean.emisorSelected}" converter="entityConverter" required="true" onchange="PF('statusInfoDialog').show();" > 
                            <f:selectItem itemLabel="---SELECCIONE---" itemValue="" noSelectionOption="true"/>
                            <f:selectItems value="#{serieComplementoBean.listEmisores}" var="emisor" itemLabel="#{emisor.nb_emisor}" itemValue="#{emisor}" />
                            <p:ajax oncomplete="PF('statusInfoDialog').hide();" process="@this" />
                        </p:selectOneMenu>
                    </div>
                    <div class="p-field">
                        <p:outputLabel for="@next" value="Serie:"/>
                        <p:inputText value="#{serieComplementoBean.serie}" required="true" placeholder="maximo 5 caracteres" >
                            <p:ajax process="@this" />
                        </p:inputText>
                    </div>
                    <div class="p-field">
                        <p:outputLabel for="@next">No. Inicial:</p:outputLabel>
                        <p:inputNumber value="#{serieComplementoBean.numero}" required="true" decimalPlaces="0" >
                            <p:ajax process="@this" />
                        </p:inputNumber>
                    </div>
                    <div class="p-field">
                        <p:outputLabel for="@next" value="Status:" />
                        <p:selectOneMenu value="#{serieComplementoBean.statusSerieComplemento}" converter="entityConverter" required="true" onchange="PF('statusInfoDialog').show();" > 
                            <f:selectItem itemLabel="---SELECCIONE---" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{serieComplementoBean.listStatusSerieComp}" var="status" itemLabel="#{status.nombre}" itemValue="#{status}" />
                            <p:ajax oncomplete="PF('statusInfoDialog').hide();" process="@this" />
                        </p:selectOneMenu>
                    </div>
                </p:outputPanel>
                <f:facet name="footer">
                    <p:commandButton value="Guardar" icon="pi pi-check" actionListener="#{serieComplementoBean.guardar()}" 
                        update="dtSerieComplementos" process="@this" onstart="PF('statusInfoDialog').show();"
                        oncomplete="PF('statusInfoDialog').hide(); if (!args.validationFailed) {PF('dlgGuardarComplemento').hide();}" 
                        disabled="#{serieComplementoBean.serieComplementoSelected.statusSerie.id eq 2}" />
                    <p:commandButton value="Cancelar" icon="pi pi-times" class="ui-button-secondary" 
                        oncomplete="PF('dlgGuardarComplemento').hide()" resetValues="true" 
                        disabled="#{serieComplementoBean.serieComplementoSelected.statusSerie.id eq 2}" />
                </f:facet>
                <p:ajax event="close" listener="#{serieComplementoBean.cerrarDialogo}" />
            </p:dialog>
            
            <p:dialog id="dlgActualizarComplemento" header="Serie Complemento de Pago" widgetVar="dlgActualizarComplemento"
                modal="true" showEffect="fade" responsive="true" closable="true" dynamic="true" cache="false" >
                <p:outputPanel id="panelActualizarComplemento" class="ui-fluid" >
                    <div class="p-field">
                        <p:outputLabel for="@next" value="EMISOR:" />
                        <p:selectOneMenu value="#{serieComplementoBean.emisorSelected}" converter="entityConverter" required="true" onchange="PF('statusInfoDialog').show();" > 
                            <f:selectItem itemLabel="---SELECCIONE---" itemValue="" noSelectionOption="true"/>
                            <f:selectItems value="#{serieComplementoBean.listEmisores}" var="emisor" itemLabel="#{emisor.nb_emisor}" itemValue="#{emisor}" />
                            <p:ajax oncomplete="PF('statusInfoDialog').hide();" process="@this" />
                        </p:selectOneMenu>
                    </div>
                    <div class="p-field">
                        <p:outputLabel for="@next" value="Serie:"/>
                        <p:inputText value="#{serieComplementoBean.serie}" required="true" placeholder="maximo 5 caracteres" >
                            <p:ajax process="@this" />
                        </p:inputText>
                    </div>
                    <div class="p-field">
                        <p:outputLabel for="@next">No. Inicial:</p:outputLabel>
                        <p:inputNumber value="#{serieComplementoBean.numero}" required="true" decimalPlaces="0" >
                            <p:ajax process="@this" />
                        </p:inputNumber>
                    </div>
                    <div class="p-field">
                        <p:outputLabel for="@next" value="Status:" />
                        <p:selectOneMenu value="#{serieComplementoBean.statusSerieComplemento}" converter="entityConverter" required="true" onchange="PF('statusInfoDialog').show();" > 
                            <f:selectItem itemLabel="---SELECCIONE---" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{serieComplementoBean.listStatusSerieComp}" var="status" itemLabel="#{status.nombre}" itemValue="#{status}" />
                            <p:ajax oncomplete="PF('statusInfoDialog').hide();" process="@this" />
                        </p:selectOneMenu>
                    </div>
                </p:outputPanel>
                <f:facet name="footer">
                    <p:commandButton value="Actualizar" icon="pi pi-check" actionListener="#{serieComplementoBean.actualizar()}" 
                        update="dtSerieComplementos" process="@this" onstart="PF('statusInfoDialog').show();"
                        oncomplete="PF('statusInfoDialog').hide(); if (!args.validationFailed) {PF('dlgActualizarComplemento').hide();}"
                        disabled="#{serieComplementoBean.serieComplementoSelected.statusSerie.id eq 2}" />
                    <p:commandButton value="Cerrar" icon="pi pi-times" class="ui-button-secondary" 
                        oncomplete="PF('dlgActualizarComplemento').hide();" 
                        disabled="#{serieComplementoBean.serieComplementoSelected.statusSerie.id eq 2}" />
                </f:facet>
                <p:ajax event="close" listener="#{serieComplementoBean.cerrarDialogo}" />
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>

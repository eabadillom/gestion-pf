<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui" 
    template="/WEB-INF/template.xhtml">
    <ui:define name="title">Serie Complementos de Pagos</ui:define>
    <ui:define name="content">
        <h:form id="form" enctype="multipart/form-data">
            <!-- Controles comunes: Notificaciones, Dialogo "STATUS" y Dialogo Confirmar (Global) -->
            <ui:include src="/protected/common/status-info.xhtml" />
            <p:panel id="pnl-datos-generales" header="DATOS GENERALES" >
                <div class="p-grid ui-fluid">
                    <div class="p-col-12 p-md-5">
                        <p:outputLabel for="soEmisores" value="Emisor" />
                        <p:selectOneMenu id="soEmisores" converter="entityConverter" value="#{serieComplementoBean.emisorSelected}" filter="true" 
                            filterMatchMode="contains" onchange="PF('statusInfoDialog').show();" >
                            <f:selectItem itemLabel="--SELECCIONE UN EMISOR--" />
                            <f:selectItems value="#{serieComplementoBean.listEmisores}" var="emisor" itemLabel="#{emisor.nb_emisor}" itemValue="#{emisor}" />
                            <p:ajax listener="#{serieComplementoBean.filtrarSeriesComplementos()}" oncomplete="PF('statusInfoDialog').hide();" 
                                process="@this" update="form:dtSerieComplementos" />
                        </p:selectOneMenu>
                    </div>
                </div>
                <div class="p-grid ui-fluid">
                    <div class="p-col-12 p-md-5">
                        <p:commandButton value="Agregar" icon="pi pi-plus" styleClass="ui-button-info p-mr-2 p-mb-2" 
                            actionListener="#{serieComplementoBean.openNew()}" onstart="PF('statusInfoDialog').show();" 
                            oncomplete="PF('statusInfoDialog').hide(); PF('dlgComplementoPago').show();" 
                            update="form:panelComplementoPago form:dlgComplementoPago" process="@this" />
                    </div>
                </div>
            </p:panel>

            <p:spacer style="height: 2rem;"/>

            <p:dataTable id="dtSerieComplementos" widgetVar="dtSerieComplementos" var="complementoPago" value="#{serieComplementoBean.listSerieComplemento}" 
                rowKey="#{complementoPago.id}" reflow="true" selection="#{serieComplementoBean.serieComplementoSelected}" rowSelectMode="single" 
                paginator="true" rows="10" paginatorPosition="bottom">
                <p:column headerText="Serie" width="5rem" style="text-align:center">
                    <h:outputText value="#{complementoPago.serie}" />
                </p:column>
                <p:column headerText="No. Inicial" width="5rem" style="text-align:center">
                    <h:outputText value="#{complementoPago.numero}" />
                </p:column>
                <p:column headerText="Emisor">
                    <h:outputText value="#{complementoPago.emisor.nb_emisor}" />
                </p:column>
                <p:column width="2rem" style="text-align: center;">
                    <p:commandButton icon="pi pi-pencil" styleClass="ui-button-info" update="form:panelComplementoPago form:dlgComplementoPago" process="@this"
                        onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide(); PF('dlgComplementoPago').show()" >
                        <f:setPropertyActionListener value="#{complementoPago}" target="#{serieComplementoBean.serieComplementoSelected}" />
                    </p:commandButton>
                </p:column>
                <p:column width="2rem" style="text-align: center;">
                    <p:commandButton icon="pi pi-trash" styleClass="ui-button-secondary" process="@this" 
                        onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide(); PF('dlgDeleteComplemento').show()" >
                        <f:setPropertyActionListener value="#{complementoPago}" target="#{serieComplementoBean.serieComplementoSelected}" />
                    </p:commandButton>
                </p:column>
            </p:dataTable>

            <p:dialog id="dlgComplementoPago" header="Agregar Complemento de Pago" widgetVar="dlgComplementoPago"
                modal="true" showEffect="fade" responsive="true">
                <p:outputPanel id="panelComplementoPago" class="ui-fluid">
                    <div class="p-field">
                        <p:outputLabel for="@next" value="Serie:"/>
                        <p:inputText value="#{serieComplementoBean.serieComplementoSelected.serie}" required="true" placeholder="maximo 5 caracteres" />
                    </div>
                    <div class="p-field">
                        <p:outputLabel value="EMISOR:" />
                        <p:selectOneMenu value="#{serieComplementoBean.serieComplementoSelected.emisor}" converter="entityConverter" required="true" onchange="PF('statusInfoDialog').show();" > 
                            <f:selectItem itemLabel="---SELECCIONE---" itemValue="" noSelectionOption="true"/>
                            <f:selectItems value="#{serieComplementoBean.listEmisores}" var="emisor" itemLabel="#{emisor.nb_emisor}" itemValue="#{emisor}" />
                            <p:ajax oncomplete="PF('statusInfoDialog').hide();"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="p-field">
                        <p:outputLabel for="@next">No. Inicial:</p:outputLabel>
                        <p:inputNumber value="#{serieComplementoBean.serieComplementoSelected.numero}" required="true" decimalPlaces="0" />
                    </div>
                </p:outputPanel>
                <f:facet name="footer">
                    <p:commandButton value="#{serieComplementoBean.serieComplementoSelected.id == null ? 'Agregar' : 'Actualizar'}" icon="pi pi-check"
                        actionListener="#{serieComplementoBean.guardar()}" update="dtSerieComplementos"
                        process="@this panelComplementoPago"
                        onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide(); PF('dlgComplementoPago').hide()" />
                    <p:commandButton value="Cancelar" icon="pi pi-times"
                        class="ui-button-danger" oncomplete="PF('dlgComplementoPago').hide()"/>
                </f:facet>
            </p:dialog>
                
            <p:confirmDialog widgetVar="dlgDeleteComplemento" showEffect="fade" width="300"
                message="¿Desea cancelar la serie complemento de pago?"
                header="Eliminar" severity="warn">
                <p:commandButton value="Sí" icon="pi pi-check"
                    actionListener="#{serieComplementoBean.eliminar()}" process="@this" update="dtSerieComplementos"
                    onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide(); PF('dlgDeleteComplemento').hide()" />
                <p:commandButton value="No" type="button"
                    styleClass="ui-button-danger" icon="pi pi-times"
                    onclick="PF('dlgDeleteComplemento').hide()" />
            </p:confirmDialog>
        </h:form>
    </ui:define>
</ui:composition>

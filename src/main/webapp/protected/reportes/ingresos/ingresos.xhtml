<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
                
	<ui:define name="title">Ingresos por facturación</ui:define>
    <ui:define name="content">
    	<ui:include src="/protected/common/custom-styles.xhtml"></ui:include>
        <h:form id="form" style="max-width: 70rem !important;">
	        <ui:include src="/protected/common/status-info.xhtml" />
	        <p:panel header="Datos generales">
		        <p:outputPanel styleClass="p-grid ui-fluid">
					<div class="p-col-6 p-md-4">
		        		<p:outputLabel value="Del" styleClass="ui-custom-title-small"/>
						<p:datePicker id="fechaInicio" value="#{reporteIngresosBean.fechaInicio}" showIcon="true" maxdate="#{reporteIngresosBean.maxDate}" pattern="dd/MM/yyyy" locale="es_MX" timeZone="GMT-6">
							<p:ajax process="@this" />
						</p:datePicker>
		        	</div>
		        	<div class="p-col-6 p-md-4">
		        		<p:outputLabel value="Al" styleClass="ui-custom-title-small"/>
						<p:datePicker id="fechaFin" value="#{reporteIngresosBean.fechaFin}" showIcon="true" maxdate="#{reporteIngresosBean.maxDate}" pattern="dd/MM/yyyy" locale="es_MX" timeZone="GMT-6">
							<p:ajax process="@this"/>
						</p:datePicker>
		        	</div>
		        	<div class="p-col-6 p-md-4">
		        		<p:outputLabel value="Banco" styleClass="ui-custom-title-small"/>
		        		<p:selectOneMenu id="select-banco" autoWidth="true" converter="entityConverter" value="#{reporteIngresosBean.bancoSelect}">
	             			<f:selectItem itemLabel="--TODOS LOS BANCOS--" Itemvalue="" />
	             			<f:selectItems value="#{reporteIngresosBean.listBanco}" var="banco" itemLabel="#{banco.nombre}" itemValue="#{banco}" />
	             		</p:selectOneMenu>
		        	</div>
		        	<div class="p-col-12 p-md-12">
		        		<p:outputLabel value="Cliente" styleClass="ui-custom-title-small"/>
		        		<p:selectOneMenu id="select-cte" autoWidth="false" converter="entityConverter" value="#{reporteIngresosBean.clienteSelect}" filter="true" filterMatchMode="contains">
	             			<f:selectItem itemLabel="--TODOS LOS CLIENTES--" />
	             			<f:selectItems value="#{reporteIngresosBean.listCliente}" var="cliente" itemLabel="#{cliente.nombre}#{cliente.alias == null ? '' : ' ('.concat(cliente.alias).concat(')')}" itemValue="#{cliente}" />
	             		</p:selectOneMenu>
		        	</div>
		        	<div class="p-col-6 p-md-2">
		        		<p:commandButton icon="pi pi-file-pdf" value="PDF" actionListener="#{reporteIngresosBean.exportarPdf}" process="@this" ajax="false" styleClass="ui-button-raised ui-button-secondary">
							<p:fileDownload value="#{reporteIngresosBean.file}" />
						</p:commandButton>
		        	</div>
		        	<div class="p-col-6 p-md-2">
		        		<p:commandButton icon="pi pi-file-excel" value="Excel"  actionListener="#{reporteIngresosBean.exportarExcel}" process="@this" ajax="false" styleClass="ui-button-raised ui-button-secondary">
							<p:fileDownload value="#{reporteIngresosBean.file}" />
						</p:commandButton>
		        	</div>
		        </p:outputPanel>
	        </p:panel>
        </h:form>
   </ui:define>
</ui:composition>

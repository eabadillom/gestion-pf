<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">


			<p:dialog widgetVar="dlgAgregarPago" header="Agregar pago" showEffect="fade" modal="true" responsive="true" fitViewport="true" style="width: 90vw; max-width: 50rem;" position="center center">
				<p:outputPanel id="pnl-agregar-pago" styleClass="ui-fluid p-grid p-col-12">
					<div class="p-col-6 p-md-6">
						<p:outputLabel value="Del" style="font-size: 0.8rem; font-weight: bold; color: #495057;" />
						<p:datePicker value="#{consultaCPD.periodoInicio}" showIcon="true" pattern="dd/MM/yyyy" locale="es_MX" timeZone="GMT-6">
							<p:ajax process="@this" event="change" listener="#{consultaCPD.cargarPagosPendientes()}" update="pnl-agregar-pago"/>
						</p:datePicker>
					</div>
					<div class="p-col-6 p-md-6">
						<p:outputLabel value="al" style="font-size: 0.8rem; font-weight: bold; color: #495057;" />
						<p:datePicker value="#{consultaCPD.periodoFin}" showIcon="true" pattern="dd/MM/yyyy" locale="es_MX" timeZone="GMT-6">
							<p:ajax process="@this" event="change" listener="#{consultaCPD.cargarPagosPendientes()}" update="pnl-agregar-pago"/>
						</p:datePicker>
					</div>
					<p:spacer style="height: 1rem;" />
					<p:dataTable value="#{consultaCPD.pagosPendientes()}" var="pago" size="small" rows="5" paginator="true" paginatorPosition="bottom">
						<p:column headerText="Fecha pago" style="text-align: center;">
							<p:outputLabel value="#{pago.fecha}">
								<f:convertDateTime pattern="dd / MMM / yyyy" locale="es_MX" timeZone="GMT-6" />
							</p:outputLabel>
						</p:column>
						<p:column headerText="Factura" style="text-align: center;">
							<p:outputLabel value="#{pago.factura.nomSerie}-#{pago.factura.numero}"></p:outputLabel>
						</p:column>
						<p:column headerText="Fecha factura" style="text-align: center;">
							<p:outputLabel value="#{pago.factura.fecha}">
								<f:convertDateTime pattern="dd / MMM / yyyy" locale="es_MX" timeZone="GMT-6" />
							</p:outputLabel>
						</p:column>
						<p:column headerText="Parcialidad" style="text-align: center;">
							<p:outputLabel value="#{pago.parcialidad}" />
						</p:column>
						<p:column headerText="Importe" style="text-align: right;">
							<p:outputLabel value="#{pago.monto}">
								<f:convertNumber type="currency" currencySymbol="$"></f:convertNumber>
							</p:outputLabel>
						</p:column>
						<p:column width="2rem">
							<p:commandButton icon="pi pi-plus" process="@this" actionListener="#{consultaCPD.solicitarFormaDePago(pago)}" update="form:dlg-forma-pago" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();PF('dlgFormaPago').show();">
							</p:commandButton>
						</p:column>
					</p:dataTable>
				</p:outputPanel>
				<f:facet name="footer">
					<p:commandButton icon="pi pi-times" value="Cerrar" styleClass="ui-button-secondary" onclick="PF('dlgAgregarPago').hide();" />
				</f:facet>
			</p:dialog>
			<p:dialog widgetVar="dlgFormaPago" header="Forma de pago" showEffect="fade" modal="true" responsive="true" fitViewport="true" style="width: 90vw; max-width: 30rem;">
				<p:outputPanel id="dlg-forma-pago" styleClass="ui-fluid p-grid p-col-12">
					<div class="p-col-12 p-md-12">
						<p:selectOneMenu value="#{consultaCPD.pago.formaPago}" autoWidth="false" filter="true" filterMatchMode="contains">
							<f:selectItem itemLabel="--SELECCIONE UNA FORMA DE PAGO--" noSelectionOption="true" />
							<f:selectItems value="#{consultaCPD.formasDePago}" var="formaPago" itemLabel="#{formaPago.formaPago} - #{formaPago.mpDescripcion}" itemValue="#{formaPago.formaPago}" />
							<p:ajax process="@this" />
						</p:selectOneMenu>
					</div>
				</p:outputPanel>
				<f:facet name="footer">
					<p:commandButton icon="pi pi-check" value="Aceptar" process="@this" actionListener="#{consultaCPD.agregarPagoPendiente()}" >
						<p:confirm header="Agregar pago al complemento" message="¿Está seguro que desea AGREGAR el pago al complemento?" icon="pi pi-exclamation-triangle" />
					</p:commandButton>
					<p:commandButton icon="pi pi-times" value="Cerrar" styleClass="ui-button-secondary" onclick="PF('dlgFormaPago').hide();">
					</p:commandButton>
				</f:facet>
			</p:dialog>


</ui:composition>
